language: python
cache: pip
python:
    - 3.12
install:
    - pip install flake8
before_script:
    - flake8 . --count --select=E901,E999,F821,F822,F823 --show-source --statistics
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
script:
    - true
notifications:
    on_success: change
    on_failure: change
